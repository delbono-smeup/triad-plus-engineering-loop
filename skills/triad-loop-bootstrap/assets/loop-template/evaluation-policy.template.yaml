version: 1
quality_loop:
  plateau_window: 2
  repeated_gap_limit: 2
  max_quality_iterations: 4
  max_elapsed_minutes: null
  max_cost_or_credit: null
  watchdog_seconds: 900
  require_at_least_one_safety_limit: true
  indeterminate_retry_limit: 1
stopping_reasons:
  - quality_bar_won
  - plateau
  - budget_exhausted
  - safety_iteration_ceiling
  - owner_stop
  - external_blocker
